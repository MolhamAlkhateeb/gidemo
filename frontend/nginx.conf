server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend (used for local Docker; in ECS the ALB routes /api directly).
    # Upstream is resolved at request time via a variable so nginx starts even when the
    # 'backend' host doesn't exist (e.g. on ECS), instead of failing at startup.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Required for SSE streaming.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
