AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AI Chatbot - CI/CD pipeline. Source (GitHub via CodeStar connection) ->
  Build & push images -> Deploy ECS service stack.

Parameters:
  EnvironmentName:
    Type: String
    Default: chatbot
  GitHubConnectionArn:
    Type: String
    Description: CodeStar Connections ARN for GitHub (create in console first).
  GitHubRepo:
    Type: String
    Description: "owner/repo"
  GitHubBranch:
    Type: String
    Default: main
  DBUsername:
    Type: String
    Default: chatbot
  DBPassword:
    Type: String
    NoEcho: true
  BedrockRegion:
    Type: String
    Default: us-east-1

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
      Policies:
        - PolicyName: build-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:*, s3:*, iam:PassRole]
                Resource: "*"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:*, codebuild:*, codestar-connections:UseConnection, iam:PassRole]
                Resource: "*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${EnvironmentName}-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: AWS_ACCOUNT_ID, Value: !Ref "AWS::AccountId" }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref "AWS::Region" }
          - { Name: ENV_NAME, Value: !Ref EnvironmentName }
      Source:
        Type: CODEPIPELINE
        BuildSpec: pipeline/buildspec.yml

  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${EnvironmentName}-deploy"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - { Name: ENV_NAME, Value: !Ref EnvironmentName }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref "AWS::Region" }
          - { Name: DB_USERNAME, Value: !Ref DBUsername }
          - { Name: DB_PASSWORD, Value: !Ref DBPassword }
          - { Name: BEDROCK_REGION, Value: !Ref BedrockRegion }
      Source:
        Type: CODEPIPELINE
        BuildSpec: pipeline/buildspec-deploy.yml

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !Ref ArtifactBucket }
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
              OutputArtifacts: [{ Name: SourceOut }]
        - Name: Build
          Actions:
            - Name: BuildImages
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration: { ProjectName: !Ref BuildProject }
              InputArtifacts: [{ Name: SourceOut }]
              OutputArtifacts: [{ Name: BuildOut }]
        - Name: Deploy
          Actions:
            - Name: DeployService
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration: { ProjectName: !Ref DeployProject }
              InputArtifacts: [{ Name: BuildOut }]

Outputs:
  PipelineName:
    Value: !Ref Pipeline
