services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Local dev: bypass Cognito auth (requests run as a dev user).
      DisableAuth: "true"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=chatbot;Username=postgres;Password=postgres"
      Storage__S3Bucket: ${S3_BUCKET}
      AWS__Region: ${AWS_REGION:-us-east-1}
      # Bedrock runs in its own region (image models are only on-demand in us-west-2).
      Bedrock__Region: ${BEDROCK_REGION:-us-west-2}
      # Local AWS credentials (use a dedicated dev IAM user).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
