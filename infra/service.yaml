AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AI Chatbot - runtime service: ECS Fargate cluster, ALB, backend + frontend
  services and IAM roles. Deploy after foundation.yaml.

Parameters:
  EnvironmentName:
    Type: String
    Default: chatbot
  BackendImage:
    Type: String
    Description: Full ECR image URI:tag for the backend.
  FrontendImage:
    Type: String
    Description: Full ECR image URI:tag for the frontend.
  DBPassword:
    Type: String
    NoEcho: true
  DBUsername:
    Type: String
    Default: chatbot
  BedrockRegion:
    Type: String
    Default: us-east-1

Resources:
  # ---------------- Cluster & logging ----------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      # Spot capacity for ~70% cheaper compute (demo workload tolerates interruptions).
      CapacityProviders: [FARGATE, FARGATE_SPOT]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}"
      RetentionInDays: 30

  # ---------------- IAM ----------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Task role granting the API access to Bedrock, Polly, Transcribe and S3.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: chatbot-app-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                  - bedrock:ListFoundationModels
                Resource: "*"
              - Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:aws:s3:::${Bucket}/*"
                    - Bucket:
                        Fn::ImportValue: !Sub "${EnvironmentName}-MediaBucket"

  # ---------------- Security groups ----------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress
      VpcId: { Fn::ImportValue: !Sub "${EnvironmentName}-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Service ingress from ALB
      VpcId: { Fn::ImportValue: !Sub "${EnvironmentName}-VpcId" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ---------------- Load balancer ----------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: !Split [",", { Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnets" }]

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: { Fn::ImportValue: !Sub "${EnvironmentName}-VpcId" }
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: { Fn::ImportValue: !Sub "${EnvironmentName}-VpcId" }
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ["/api/*", "/health"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ---------------- Task definitions ----------------
  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-backend"
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - Name: AWS__Region
              Value: !Ref BedrockRegion
            - Name: Bedrock__Region
              Value: !Ref BedrockRegion
            - Name: Storage__S3Bucket
              Value: { Fn::ImportValue: !Sub "${EnvironmentName}-MediaBucket" }
            - Name: Cognito__Authority
              Value: !Sub
                - "https://cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}"
                - PoolId: { Fn::ImportValue: !Sub "${EnvironmentName}-UserPoolId" }
            - Name: Cognito__Audience
              Value: { Fn::ImportValue: !Sub "${EnvironmentName}-UserPoolClientId" }
            - Name: ConnectionStrings__Postgres
              Value: !Sub
                - "Host=${DbHost};Port=5432;Database=chatbot;Username=${DBUsername};Password=${DBPassword}"
                - DbHost: { Fn::ImportValue: !Sub "${EnvironmentName}-DBEndpoint" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-frontend"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref FrontendImage
          PortMappings: [{ ContainerPort: 80 }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # ---------------- Services ----------------
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      Cluster: !Ref Cluster
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      DesiredCount: 1
      TaskDefinition: !Ref BackendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets + public IP provide outbound access without a NAT Gateway.
          AssignPublicIp: ENABLED
          Subnets: !Split [",", { Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnets" }]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      DesiredCount: 1
      TaskDefinition: !Ref FrontendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public subnets + public IP provide outbound access without a NAT Gateway.
          AssignPublicIp: ENABLED
          Subnets: !Split [",", { Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnets" }]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup

Outputs:
  AppUrl:
    Description: Public URL of the application.
    Value: !Sub "http://${LoadBalancer.DNSName}"
